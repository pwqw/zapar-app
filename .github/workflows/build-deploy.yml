name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    environment: PlayStore
    steps:
      - uses: actions/checkout@v5

      - name: Setup Android release environment
        id: setup
        uses: ./.github/actions/android-release-setup
        with:
          keystore_base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          key_password: ${{ secrets.KEY_PASSWORD }}

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: android-deps-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*') }}

      - name: Build AppBundle
        run: >
          flutter build appbundle --release
          --build-name="${{ steps.setup.outputs.version_name }}"
          --build-number="${{ steps.setup.outputs.version_code }}"
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          --dart-define=KOEL_HOST=${{ secrets.KOEL_HOST }}
          -Ptarget-platform=android-arm,android-arm64
        env:
          ORG_GRADLE_PROJECT_APP_LABEL: ${{ secrets.APP_LABEL }}
          ORG_GRADLE_PROJECT_PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name="${{ steps.setup.outputs.version_name }}"
          --build-number="${{ steps.setup.outputs.version_code }}"
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          --dart-define=KOEL_HOST=${{ secrets.KOEL_HOST }}
        env:
          ORG_GRADLE_PROJECT_APP_LABEL: ${{ secrets.APP_LABEL }}
          ORG_GRADLE_PROJECT_PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}

      - name: Verify build outputs
        run: |
          AAB="build/app/outputs/bundle/release/app-release.aab"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$AAB" ]; then
            echo "AAB not found at $AAB" >&2
            exit 1
          fi
          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK" >&2
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          ls -lh "$AAB" "$APK"

      - name: Upload to Play Store (internal testing — published)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: ${{ secrets.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "${{ github.ref_name }}"
          build/app/outputs/flutter-apk/app-release.apk
          --title "Release ${{ github.ref_name }}"
          --verify-tag
