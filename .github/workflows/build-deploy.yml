name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest
    environment: PlayStore
    steps:
      - uses: actions/checkout@v5

      - name: Setup Android release environment
        id: setup
        uses: ./.github/actions/android-release-setup
        with:
          keystore_base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          key_password: ${{ secrets.KEY_PASSWORD }}

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: android-deps-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*') }}

      - name: Build AppBundle
        run: >
          flutter build appbundle --release
          --build-name="${{ steps.setup.outputs.version_name }}"
          --build-number="${{ steps.setup.outputs.version_code }}"
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          --dart-define=KOEL_HOST=${{ secrets.KOEL_HOST }}
          -Ptarget-platform=android-arm,android-arm64
        env:
          ORG_GRADLE_PROJECT_APP_LABEL: ${{ secrets.APP_LABEL }}
          ORG_GRADLE_PROJECT_PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name="${{ steps.setup.outputs.version_name }}"
          --build-number="${{ steps.setup.outputs.version_code }}"
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          --dart-define=KOEL_HOST=${{ secrets.KOEL_HOST }}
          -Ptarget-platform=android-arm,android-arm64
        env:
          ORG_GRADLE_PROJECT_APP_LABEL: ${{ secrets.APP_LABEL }}
          ORG_GRADLE_PROJECT_PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "Release ${{ github.ref_name }}"
          --verify-tag

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  deploy_playstore:
    needs: build_release
    uses: ./.github/workflows/deploy-playstore.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  upload_apk:
    needs: deploy_playstore
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release-assets

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release upload "${{ github.ref_name }}"
          release-assets/app-release.apk
          --clobber
